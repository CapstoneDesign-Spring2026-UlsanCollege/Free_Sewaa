name: CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install
        working-directory: server

      - name: Run tests
        run: npm test
        working-directory: server
        env:
          MONGO_URI: mongodb://localhost:27017/freesewaa_test
          CI: true

      - name: Check folders exist
        run: |
          test -d html && test -d css && test -d js && test -d server

      - name: Count files
        run: |
          echo "HTML: $(ls html/*.html | wc -l)"
          echo "CSS: $(ls css/*.css | wc -l)"
          echo "JS: $(ls js/*.js | wc -l)"

      - name: Verify server.js
        run: test -f server/server.js

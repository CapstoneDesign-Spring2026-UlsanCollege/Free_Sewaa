name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check required files
        run: |
          test -f ../README.md
          test -f server.js
          test -d ../html && test -d ../css && test -d ../js

      - name: Verify scripts exist
        run: |
          node -e "const p = require('./package.json'); ['install','test'].forEach(s => { if(!p.scripts[s]) { console.error('Missing script: '+s); process.exit(1) } })"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/freesewaa_test
          CI: true

      - name: Check HTML files
        run: echo "HTML pages: $(ls html/*.html | wc -l)"
        working-directory: .

      - name: Check CSS files
        run: echo "CSS files: $(ls css/*.css | wc -l)"
        working-directory: .

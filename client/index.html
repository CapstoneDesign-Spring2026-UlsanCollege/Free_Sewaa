<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free Sewaa community giving platform." />
    <title>Free Sewaa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      .boot-fallback {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, sans-serif;
        color: #f4fffb;
        background: linear-gradient(180deg, #071219 0%, #0d2530 52%, #091820 100%);
      }
      .boot-fallback__panel {
        width: min(680px, 100%);
      }
      .boot-fallback h1 {
        margin: 0 0 16px;
        font-size: clamp(2.4rem, 7vw, 5rem);
        line-height: 1;
      }
      .boot-fallback p {
        color: rgba(244, 255, 251, 0.78);
        line-height: 1.7;
      }
      .boot-fallback a {
        display: inline-flex;
        margin-top: 12px;
        padding: 12px 16px;
        border-radius: 8px;
        color: #052027;
        background: linear-gradient(135deg, #b8f4e4 0%, #35c7aa 48%, #2bb9d6 100%);
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">
        <div class="boot-fallback__panel">
          <h1>Free Sewaa</h1>
          <p>Give what you can. Find what you need.</p>
          <p>The app is loading. If this message stays on screen, open the home page again.</p>
          <a href="/app.html">Open Free Sewaa Home</a>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
